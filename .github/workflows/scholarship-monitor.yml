name: Monitoreo editorial de becas

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: scholarship-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Restaurar último snapshot válido de una ejecución exitosa
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/scholarship-monitor/restore.mjs
      - run: npm ci
      - name: Consultar fuentes oficiales y generar reporte
        run: npm run monitor:becas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scholarship-monitor-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/scholarship-monitor/latest.md
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: scholarship-monitor-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/scholarship-monitor/snapshots.json
          if-no-files-found: error
          retention-days: 90
