name: Monitoreo editorial de becas

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Recuperar último snapshot exitoso, si existe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=scholarship-monitor-snapshot&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "$artifact_id" ]; then
            mkdir -p reports/scholarship-monitor
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/scholarship-snapshot.zip
            unzip -j /tmp/scholarship-snapshot.zip snapshots.json -d reports/scholarship-monitor
          fi
      - name: Consultar fuentes oficiales y generar reporte
        run: npm run monitor:becas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scholarship-monitor-report-${{ github.run_id }}
          path: reports/scholarship-monitor/latest.md
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: scholarship-monitor-snapshot
          path: reports/scholarship-monitor/snapshots.json
          retention-days: 90
